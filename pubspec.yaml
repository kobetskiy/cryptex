name: cryptex
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # svg icons
  flutter_svg: ^2.0.17

  # local storage 
  shared_preferences: ^2.5.2

  # navigation
  auto_route: ^9.3.0+1

  # bloc
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  auto_route_generator: ^9.3.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#111B3C"
  color_dark: "#111B3C"
  image: "assets/images/splash_logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
flutter_intl:
  enabled: true
